# Colors and settings shared by all platforms.
#
# Imported by alacritty-linux.toml and alacritty-macos.toml. Not meant to be
# linked as ~/.config/alacritty/alacritty.toml directly, since it does not set
# a shell program.

[window]
startup_mode = "Maximized"

[keyboard]
bindings = [{ key = "F11", action = "ToggleFullscreen" }]

[colors.primary]
background = '#000000'
foreground = '#ffffff'

[colors.normal]
black   = '#000000'
red     = '#cd0000'
green   = '#00cd00'
yellow  = '#cdcd00'
blue    = '#3388ff'
magenta = '#cd00cd'
cyan    = '#00cdcd'
white   = '#e5e5e5'

[colors.bright]
black   = '#7f7f7f'
red     = '#ff0000'
green   = '#00ff00'
yellow  = '#ffff00'
blue    = '#5c5cff'
magenta = '#ff00ff'
cyan    = '#00ffff'
white   = '#ffffff'
